  <div class="main-inner">
    <div id="banners"></div>
    <div id="view" tabindex="-1"></div>

  <a href="#/habitos" data-tab="habitos"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m8.2 12.4 2.6 2.6 5-5.2"/></svg><span>Hábitos</span><span class="badge" id="tabHabitBadge" hidden></span></a>

<div id="toasts" role="status" aria-live="polite"></div>

<!-- Task editor -->
<dialog id="taskDialog" aria-labelledby="taskDlgTitle">
  <form id="taskForm" class="dlg" novalidate>
    <header class="dlg-h">
      <h2 id="taskDlgTitle">Nueva tarea</h2>
      <button type="button" class="btn-icon" data-close-dialog aria-label="Cerrar"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <div class="dlg-body">
      <label class="field"><span class="field-l">Título</span><input id="tTitle" type="text" required maxlength="200" autocomplete="off" placeholder="¿Qué vas a hacer?"></label>
      <div class="row2">
        <label class="field"><span class="field-l">Categoría</span><select id="tCategory"></select></label>
        <label class="field"><span class="field-l">Fecha</span><input id="tDate" type="date"></label>
      </div>
      <div class="row2">
        <label class="field"><span class="field-l">Hora <span class="opt">(opcional)</span></span><input id="tTime" type="time" step="300"></label>
        <label class="field"><span class="field-l">Duración (min)</span><input id="tDuration" type="number" min="5" max="720" step="5" inputmode="numeric"></label>
      </div>
      <div class="chips-row" role="group" aria-label="Duración rápida">
        <button type="button" class="chip chip-btn" data-dur="15">15'</button><button type="button" class="chip chip-btn" data-dur="30">30'</button><button type="button" class="chip chip-btn" data-dur="45">45'</button><button type="button" class="chip chip-btn" data-dur="60">1 h</button><button type="button" class="chip chip-btn" data-dur="90">1 h 30</button><button type="button" class="chip chip-btn" data-dur="120">2 h</button>
      </div>
      <div class="row2" id="tEntregaRow">
        <label class="field"><span class="field-l">Fecha de entrega</span><input id="tDue" type="date"></label>
        <label class="field"><span class="field-l">Peso en la nota (%)</span><input id="tWeight" type="number" min="0" max="100" step="1" inputmode="numeric"></label>
      </div>
      <label class="field"><span class="field-l">Notas</span><textarea id="tNotes" rows="3" maxlength="2000" placeholder="Contexto, enlaces, siguiente paso…"></textarea></label>
      <div id="tWarnings" class="warn-list" aria-live="polite"></div>
      <p id="tHint" class="hint" hidden>Consejo: divide en bloques de 2 h como máximo</p>
      <p id="tError" class="form-error" role="alert" hidden></p>
    </div>
    <footer class="dlg-f">
      <button type="button" id="tDelete" class="btn btn-ghost btn-danger">Borrar</button>
      <span class="grow"></span>
      <button type="button" id="tArchive" class="btn btn-secondary">Archivar</button>
      <button type="button" id="tDone" class="btn btn-secondary">Marcar hecha</button>
      <button type="submit" id="tSave" class="btn btn-primary">Guardar</button>
    </footer>
  </form>
</dialog>

<!-- Nightly review wizard -->
<dialog id="reviewDialog" aria-labelledby="reviewTitle" class="dlg-wide">
  <div class="dlg">
    <header class="dlg-h">
      <div>
        <h2 id="reviewTitle">🌙 Revisión nocturna</h2>
        <ol class="steps" id="reviewSteps" aria-label="Pasos"></ol>
      </div>
      <button type="button" class="btn-icon" id="reviewClose" aria-label="Cancelar y cerrar"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <div class="dlg-body" id="reviewBody"></div>
    <footer class="dlg-f" id="reviewFoot"></footer>
  </div>
</dialog>

<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
