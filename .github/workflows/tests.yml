name: tests
on:
  push:
  pull_request:
jobs:
  all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python deps
        run: pip install pyyaml numpy scipy pandas matplotlib scikit-learn joblib nbformat nbclient ipykernel pytest
      - name: Run all tests
        run: ./ejecutar_tests.sh
