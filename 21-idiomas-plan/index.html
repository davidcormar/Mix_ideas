<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan de idiomas</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --mute:#6b7280; --line:#e5e7eb; --acc:#2563eb; --ok:#16a34a; --bad:#dc2626; --warn:#d97706; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b21; --ink:#e8eaed; --mute:#9aa0a6; --line:#2a2f37; --acc:#60a5fa; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:820px; margin:0 auto; padding:12px 16px 60px; }
  h1 { font-size:18px; margin:6px 0 10px; } h2 { font-size:16px; margin:0 0 6px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; }
  input, select, button { font:inherit; color:inherit; }
  input, select { width:100%; padding:9px; border:1px solid var(--line); border-radius:10px; background:var(--bg); }
  button { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 12px; cursor:pointer; }
  button.primary { background:var(--acc); color:#fff; border-color:var(--acc); }
  .tabs { display:flex; gap:6px; margin-bottom:10px; } .tabs button.on { border-color:var(--acc); color:var(--acc); font-weight:600; }
  .bar { height:14px; background:var(--bg); border:1px solid var(--line); border-radius:99px; overflow:hidden; } .bar>div { height:100%; background:var(--acc); }
  .kpi { font-size:20px; font-weight:700; } .muted { color:var(--mute); font-size:13px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  table { width:100%; border-collapse:collapse; font-size:14px; } td, th { padding:5px 4px; border-bottom:1px solid var(--line); text-align:left; }
  canvas { width:100%; height:140px; display:block; }
  .flex { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
</style>
<!-- pwa -->
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="../pwa.js" defer></script>
</head>
<body>
<main>
  <h1>🗣️ Plan de idiomas</h1>
  <div class="card">
    <h2>Registrar sesión</h2>
    <div class="grid">
      <input id="fDate" type="date">
      <select id="fLang"></select>
      <input id="fMin" type="number" inputmode="numeric" min="1" placeholder="minutos" value="60">
      <select id="fType"></select>
    </div>
    <div class="flex" style="margin-top:8px"><button class="primary" id="add">Añadir</button><span class="muted" id="hint"></span></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="dash"></div>
  <div class="card"><h2>Últimas sesiones</h2><table id="log"></table></div>
  <div class="card flex">
    <button id="export">Exportar JSON</button><button id="importBtn">Importar JSON</button><input type="file" id="importFile" accept="application/json" hidden>
    <span class="muted">Datos solo en este navegador (localStorage).</span>
  </div>
</main>
<script src="logic.js"></script>
<script>
(function () {
  const L = window.LangLogic, KEY = "idiomas.v1", $ = (s) => document.querySelector(s);
  const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
  let db; try { db = L.validate(JSON.parse(localStorage.getItem(KEY))); } catch { db = { log: [], base: {} }; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {} };
  let cur = "fr";
  $("#fDate").value = today();
  $("#fLang").innerHTML = Object.entries(L.LANGS).map(([k, v]) => `<option value="${k}">${v.name}</option>`).join("");
  const types = ["gramatica", "escucha", "lectura", "escritura", "conversacion", "inmersion", "extra"];
  $("#fType").innerHTML = types.map((t) => `<option value="${t}">${L.LABEL[t]}</option>`).join("");
  $("#fLang").onchange = () => { cur = $("#fLang").value; suggest(); render(); };
  function suggest() {
    const L0 = L.LANGS[$("#fLang").value];
    if (L0.cycle) $("#fType").value = L.nextSession(db.log, $("#fLang").value).type;
    $("#hint").textContent = L0.cycle ? `Toca: ${L.LABEL[$("#fType").value]}` : "";
  }
  $("#add").onclick = () => {
    const m = Number($("#fMin").value); if (!(m > 0)) return alert("Minutos no válidos");
    db.log.push({ date: $("#fDate").value || today(), lang: $("#fLang").value, minutes: m, type: $("#fType").value, t: Date.now() });
    save(); suggest(); render();
  };
  $("#tabs").innerHTML = Object.entries(L.LANGS).map(([k, v]) => `<button data-l="${k}">${v.name}</button>`).join("");
  $("#tabs").onclick = (ev) => { const b = ev.target.closest("button"); if (!b) return; cur = b.dataset.l; $("#fLang").value = cur; suggest(); render(); };
  $("#log").onclick = (ev) => { const i = ev.target.dataset.del; if (i !== undefined && confirm("¿Borrar?")) { db.log.splice(Number(i), 1); save(); render(); } };

  function render() {
    document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.l === cur));
    db.base ||= {}; const C = L.LANGS[cur], t = today(), s = L.summary(db.log, cur, t, Number(db.base[cur] || 0));
    const started = t >= C.start;
    const fmtD = (x) => x ? new Date(x + "T00:00:00").toLocaleDateString("es-ES", { day: "numeric", month: "short", year: "numeric" }) : "—";
    $("#dash").innerHTML = `<div class="card">
      <h2>${C.name} → ${C.goal} <span class="muted">(${fmtD(C.start)} → ${fmtD(C.deadline)})</span></h2>
      ${started ? "" : `<p class="warn">Empieza el ${fmtD(C.start)} (cuando tengas el B2 de francés). Puedes registrar horas antes si quieres adelantar.</p>`}
      <div class="bar"><div style="width:${Math.min(100, (s.hours / C.hoursTarget) * 100).toFixed(1)}%"></div></div>
      <p><b>${s.hours.toFixed(1).replace(".", ",")} h</b> de ~${C.hoursTarget} h (rango ${C.hoursRange.join("-")} h) · faltan ${s.remainingH.toFixed(0)} h en ${s.daysLeft} días</p>
      <div class="grid">
        ${C.floorMin ? `<div><div class="muted">Hoy te toca (suelo + pendiente)</div><div class="kpi ${s.todayRequired > C.floorMin ? "warn" : ""}">${s.todayRequired} min</div><div class="muted">pendiente acumulado: ${s.owed} min</div></div>` : ""}
        <div><div class="muted">Ritmo últimos 28 días</div><div class="kpi">${Math.round(s.pace)} min/día</div></div>
        <div><div class="muted">Necesario para llegar</div><div class="kpi ${s.requiredPerDay > s.pace ? "bad" : "ok"}">${isFinite(s.requiredPerDay) ? Math.round(s.requiredPerDay) : "—"} min/día</div></div>
        <div><div class="muted">A este ritmo llegas</div><div class="kpi ${s.onTrack ? "ok" : "bad"}" style="font-size:16px">${fmtD(s.eta)}</div></div>
        ${C.cycle ? `<div><div class="muted">Producción (escribir + hablar)</div><div class="kpi ${s.productionShare < 0.3 ? "warn" : "ok"}">${Math.round(s.productionShare * 100)} %</div><div class="muted">prioridad desde nov 2026</div></div>
        <div><div class="muted">Próxima sesión del ciclo</div><div class="kpi" style="font-size:16px">${L.LABEL[L.nextSession(db.log, cur).type]}</div></div>` : ""}
      </div>
      <div class="flex" style="margin:8px 0"><label class="muted" style="flex:1">Horas previas estimadas (colegio, cursos…)</label><input id="base" type="number" min="0" step="10" value="${db.base[cur] || 0}" style="max-width:110px"></div>
      <canvas id="wk"></canvas><div class="muted">Minutos por semana (8 semanas)</div>
    </div>`;
    $("#base").onchange = (ev) => { db.base[cur] = Math.max(0, Number(ev.target.value) || 0); save(); render(); };
    const w = L.weeklyMinutes(db.log, cur, t), cv = $("#wk"), dpr = devicePixelRatio || 1, W = cv.clientWidth, H = 140;
    cv.width = W * dpr; cv.height = H * dpr; const c = cv.getContext("2d"); c.scale(dpr, dpr);
    const max = Math.max(C.standardMin * 7, ...w.map((x) => x.minutes)), bw = W / w.length;
    const css = getComputedStyle(document.documentElement);
    w.forEach((x, i) => { const h = (x.minutes / max) * (H - 20); c.fillStyle = css.getPropertyValue("--acc"); c.fillRect(i * bw + 4, H - h - 14, bw - 8, h); c.fillStyle = css.getPropertyValue("--mute"); c.font = "10px system-ui"; c.fillText(x.start.slice(5), i * bw + 4, H - 2); });
    if (C.floorMin) { const y = H - 14 - (C.floorMin * 7 / max) * (H - 20); c.strokeStyle = css.getPropertyValue("--bad"); c.setLineDash([4, 4]); c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
    const rows = db.log.map((e, i) => ({ e, i })).filter(({ e }) => e.lang === cur).sort((a, b) => b.e.date.localeCompare(a.e.date)).slice(0, 12);
    $("#log").innerHTML = rows.map(({ e, i }) => `<tr><td>${e.date}</td><td>${L.LABEL[e.type]}</td><td>${e.minutes}'</td><td><button data-del="${i}" style="padding:2px 6px">✕</button></td></tr>`).join("") || `<tr><td class="muted">Sin sesiones aún.</td></tr>`;
  }
  $("#export").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type: "application/json" })); a.download = `idiomas-${today()}.json`; a.click(); };
  $("#importBtn").onclick = () => $("#importFile").click();
  $("#importFile").onchange = async (ev) => { const f = ev.target.files[0]; if (!f) return; try { db = L.validate(JSON.parse(await f.text())); save(); render(); } catch (e) { alert("Error: " + e.message); } ev.target.value = ""; };
  suggest(); render();
})();
</script>
</body>
</html>
